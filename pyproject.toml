[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xhsviewer"
version = "0.3.0"
description = "小红书 CLI 客户端：推荐流图文浏览、终端内图片查看（Kitty 协议，支持 Ghostty），基于 xhs CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.86,<0.90",
    "requests>=2.31",
    "pillow>=10.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.scripts]
xhsviewer = "xhs_cli.__main__:main"

[tool.setuptools]
packages = ["xhs_cli", "xhs_cli.ui"]

[tool.setuptools.package-data]
xhs_cli = ["*.tcss"]
